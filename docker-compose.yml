# Local stack: one Postgres (Airflow metadata + the "statcast" warehouse),
# Airflow 3 in standalone mode (API server, scheduler, DAG processor, triggerer),
# and the stat-cast web app (Next.js, the same build that runs on Cloudflare).
#
#   docker compose up -d --build        then open http://localhost:8080 (Airflow)
#                                        and http://localhost:3000 (web app)
#
# Defaults to the offline synthetic sample. Set STATCAST_SOURCE=savant in .env
# to pull live data from Baseball Savant.

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Chicago
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
  # Local development only: every visitor is an admin, no login screen.
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
  # Defaults to the warehouse in this stack. Point WAREHOUSE_* at a managed Postgres
  # (in .env) to load the database the Cloudflare site reads through Hyperdrive.
  WAREHOUSE_HOST: ${WAREHOUSE_HOST:-postgres}
  WAREHOUSE_PORT: ${WAREHOUSE_PORT:-5432}
  WAREHOUSE_DB: ${WAREHOUSE_DB:-statcast}
  WAREHOUSE_USER: ${WAREHOUSE_USER:-statcast}
  WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-statcast}
  WAREHOUSE_SSLMODE: ${WAREHOUSE_SSLMODE:-prefer}
  STATCAST_SOURCE: ${STATCAST_SOURCE:-sample}
  STATCAST_LANDING_DIR: /opt/airflow/landing
  STATCAST_SAMPLE_FILE: /opt/airflow/sample/statcast_sample.csv.gz

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-warehouse.sql:/docker-entrypoint-initdb.d/init-warehouse.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow:
    build: .
    command: standalone
    environment: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - ./dbt:/opt/airflow/dbt:ro
      - ./data/sample:/opt/airflow/sample:ro
      - landing:/opt/airflow/landing
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web
    environment:
      WAREHOUSE_HOST: ${WAREHOUSE_HOST:-postgres}
      WAREHOUSE_PORT: ${WAREHOUSE_PORT:-5432}
      WAREHOUSE_DB: ${WAREHOUSE_DB:-statcast}
      WAREHOUSE_USER: ${WAREHOUSE_USER:-statcast}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-statcast}
      # Read-only view of the latest DAG runs, straight from Airflow's metadata DB.
      AIRFLOW_DATABASE_URL: postgres://airflow:airflow@postgres:5432/airflow
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  landing:
