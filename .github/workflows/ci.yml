name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    name: loader + dbt on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: statcast
          POSTGRES_PASSWORD: statcast
          POSTGRES_DB: statcast
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U statcast" --health-interval 5s --health-retries 10
    env:
      WAREHOUSE_HOST: localhost
      STATCAST_SOURCE: sample
      DBT_PROFILES_DIR: dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Load the sample week
        run: PYTHONPATH=src python -m statcast_pipeline backfill --start 2025-06-02 --end 2025-06-09
      - name: dbt build (models, unit tests, data tests)
        run: dbt build --project-dir dbt
      - name: dbt build again (incremental path)
        run: dbt build --project-dir dbt --select fct_pitches+

  dag:
    name: Airflow DAG integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          pip install "apache-airflow==3.4.0" -r requirements.txt pytest
          --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.4.0/constraints-3.12.txt
      - run: pytest -q tests/test_dag.py
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"

  lakehouse:
    name: Databricks lakehouse transforms on Spark ${{ matrix.pyspark }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pyspark: ["3.5.3", "4.0.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-lakehouse.txt "pyspark==${{ matrix.pyspark }}"
      - name: bronze, silver, gold and quality checks on the sample week
        run: pytest -q tests/lakehouse
