[project]
name = "statcast-pipeline"
version = "0.1.0"
description = "Daily Statcast pipeline: Baseball Savant -> Postgres -> dbt, orchestrated by Airflow"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["dbt"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
