[project]
name = "statcast-pipeline"
version = "0.1.0"
description = "Daily Statcast pipeline: Baseball Savant -> Postgres -> dbt on Airflow, and a Delta lakehouse on Databricks"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["dbt"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: spark, dbutils and display are provided by the runtime; imports follow %run.
"databricks/notebooks/*.py" = ["F821", "E402", "I001"]
